# 抓取
time_window_years: 2          # 仅保留近 N 年收藏
fetch:
  min_interval_s: 3.0         # 请求间最小间隔
  max_interval_s: 8.0         # 请求间最大间隔
  max_notes: null             # null=全部;调试可设小值
# 转写
transcribe:
  enabled: true
  model_size: small           # faster-whisper 模型
  language: zh
# 路径
paths:
  data_dir: data
  vault_dir: vault
